spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:ugnay}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:ugnay}
    password: ${MYSQL_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 6
      connection-timeout: 10000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
server:
  address: 127.0.0.1
  port: ${PORT:8080}
  tomcat:
    threads:
      min-spare: 2
      max: 16
    accept-count: 25
  servlet:
    session:
      cookie:
        secure: false
ugnay:
  security:
    allowed-origins: ""
    public-demo-read: false
  storage:
    filesystem-root: ${UGNAY_DOCUMENT_ROOT:${user.home}/AppData/Local/UGNAY/data/documents}
  ingestion:
    max-file-bytes: 15728640
    extraction-workers: 1
    extraction-queue-capacity: 4
  tika:
    max-characters: 500000
    timeout-seconds: 45
  defender:
    timeout-seconds: 45
  discovery:
    minimum-free-memory-bytes: 734003200
    idle-unload-seconds: 120
logging:
  file:
    name: ${UGNAY_LOG_FILE:${user.home}/AppData/Local/UGNAY/logs/ugnay.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 5
      total-size-cap: 50MB
