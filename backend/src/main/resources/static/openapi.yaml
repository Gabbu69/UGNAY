openapi: 3.1.0
info:
  title: UGNAY Research Continuity API
  version: 0.3.0
  description: Explainable research discovery, interpreted research queries, reproducible retrieval evaluation, historical research warehousing, traceability, scope analysis, and continuity API. Recommendations and metrics never replace academic decisions.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      security: []
      summary: Start a same-origin server session
      description: Used by the browser account panel after `/auth/me` reports a live anonymous session. A successful response establishes the HttpOnly JDBC-backed session cookie; no browser access token is returned or stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthView' } } } }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/csrf:
    get:
      security: []
      summary: Issue the CSRF token/cookie required by authenticated mutations
      responses:
        '200': { description: CSRF token metadata }
  /auth/me:
    get:
      security: []
      summary: Inspect the current session
      description: The browser account panel uses this response to distinguish an authenticated user from a reachable anonymous session. Network failure is represented by the client as an unavailable state, not as anonymous authentication.
      responses:
        '200': { description: Authenticated or anonymous session state, content: { application/json: { schema: { $ref: '#/components/schemas/AuthView' } } } }
  /auth/logout:
    post:
      security: []
      summary: Invalidate the current JDBC-backed session
      description: The browser account panel first obtains `/auth/csrf`, sends the named token header on this request, then invalidates and refetches session and workspace queries.
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '204': { description: Session invalidated }
        '403': { $ref: '#/components/responses/Problem' }
  /auth/invitations/accept:
    post:
      security: []
      summary: Accept a single-use invitation and create a persistent account
      description: The invitation token authorizes this public action and must be unused and unexpired. The account inherits the inviter's department and receives the invitation's one intended role; acceptance does not start a login session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, displayName, password]
              properties:
                token: { type: string, minLength: 1 }
                displayName: { type: string, minLength: 1, maxLength: 160 }
                password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        '201': { description: Persistent invited account, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /workspace:
    get:
      summary: Load the complete UI workspace projection
      parameters:
        - { in: query, name: projectId, required: false, schema: { type: string, format: uuid }, description: Granted project to select; omitted selects the first accessible project }
      responses:
        '200': { description: WorkspaceData contract, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }
  /dashboard:
    get:
      summary: Load dashboard counts, health, and review queue
      responses:
        '200': { description: Dashboard aggregate }
  /studies:
    get:
      summary: Search the authenticated research catalogue
      parameters:
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200': { description: Ranked catalogue study views, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Study' } } } } }
  /studies/{id}:
    get:
      summary: Read complete study evidence
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Study detail }
        '404': { $ref: '#/components/responses/Problem' }
  /catalogue/search:
    get:
      summary: Search the catalogue with server-side filtering and pagination
      description: Requires an authenticated session. Archived rows are excluded. Non-curators do not receive RESTRICTED or EMBARGOED rows; this endpoint does not manufacture a similarity score.
      parameters:
        - { in: query, name: q, schema: { type: string }, description: Case-insensitive text search over actual catalogue fields }
        - { in: query, name: department, schema: { type: string }, description: Case-insensitive exact department code }
        - { in: query, name: yearFrom, schema: { type: integer } }
        - { in: query, name: yearTo, schema: { type: integer } }
        - { in: query, name: lifecycle, schema: { type: string }, description: Case-insensitive exact lifecycle status }
        - { in: query, name: topic, schema: { type: string }, description: Exact active canonical KEYWORD or RESEARCH_AREA label }
        - { in: query, name: page, schema: { type: integer, default: 0, minimum: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: Values are clamped to 1 through 100 }
        - { in: query, name: sort, schema: { enum: [YEAR_DESC, YEAR_ASC, TITLE_ASC, TITLE_DESC], default: YEAR_DESC } }
      responses:
        '200': { description: Authorized page of catalogue facts, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogueSearchPage' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /research-queries/grammar:
    get:
      summary: Read the implemented UGNAY RQL grammar, examples, limits, and safety boundary
      description: Requires any authenticated role.
      responses:
        '200': { description: Versioned grammar description, content: { application/json: { schema: { $ref: '#/components/schemas/ResearchQueryGrammar' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /research-queries/execute:
    post:
      summary: Tokenize, parse, validate, interpret, and execute one bounded UGNAY RQL statement
      description: Requires any authenticated role and CSRF. Language, semantic, availability, and safe execution failures are represented in the HTTP 200 response status/diagnostics; no SQL is accepted or exposed.
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResearchQueryExecuteRequest' }
      responses:
        '200': { description: Processing trace and authorized result or a structured language/execution diagnostic, content: { application/json: { schema: { $ref: '#/components/schemas/ResearchQueryExecuteResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /imports/studies:
    post:
      summary: Import reviewed study metadata
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Imported study }
        '422': { $ref: '#/components/responses/Problem' }
  /imports/documents:
    post:
      summary: Validate, scan, privately store, and durably queue PDF extraction
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        '202': { description: "Durable extraction job ID, status URL, and progress-events URL" }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /imports/documents/jobs/{jobId}:
    get:
      summary: Read persistent PDF extraction status, limits, progress, and publication eligibility
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: Persistent extraction job }, '404': { $ref: '#/components/responses/Problem' } }
  /imports/documents/jobs/{jobId}/events:
    get:
      summary: Subscribe to extraction progress while GET status remains the durable source of truth
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses: { '200': { description: text/event-stream progress events }, '404': { $ref: '#/components/responses/Problem' } }
  /imports/documents/jobs/{jobId}/publish-study:
    post:
      summary: Curator publication of reviewed extracted evidence as a catalogue study
      parameters: [ { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Published study and immutable document-version association }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /problems:
    get: { summary: List structured problem cases in the authenticated account's department or granted project, responses: { '200': { description: Authorized problem cases } } }
    post:
      summary: Create a structured problem case
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Created problem case }, '400': { $ref: '#/components/responses/Problem' } }
  /proposals:
    get: { summary: List proposals in the authenticated account's department or granted project, responses: { '200': { description: Authorized proposals } } }
    post:
      summary: Create a proposal from a problem case
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Created proposal } }
  /intakes:
    post:
      summary: Atomically persist one problem, proposal, evidence-reference set, and frozen discovery run
      description: Reusing the same Idempotency-Key and normalized payload returns the original records; reusing it with different content returns 409. Optional information remains absent rather than being replaced with plausible prose.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IntakeRequest' } } }
      responses:
        '201': { description: First atomic submission, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeResponse' } } } }
        '200': { description: Exact idempotent replay, content: { application/json: { schema: { $ref: '#/components/schemas/IntakeResponse' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /discovery-runs:
    get: { summary: List authorized immutable discovery runs, responses: { '200': { description: Authorized discovery runs } } }
    post:
      summary: Run explainable hybrid research discovery
      description: Requires one persisted proposal ID. Missing local model assets produce PARTIAL results; component weights are never rescaled.
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoveryInput' }
      responses:
        '201': { description: Explainable ranked result, content: { application/json: { schema: { $ref: '#/components/schemas/DiscoveryRun' } } } }
  /proposal-decisions:
    get: { summary: List authorized immutable human route decisions, responses: { '200': { description: Authorized proposal decisions } } }
    post:
      summary: Record a human route; an approval atomically creates project baseline and continuity state
      description: The proposal and frozen run must match. Improve, Continue, and duplicate closure require a primary predecessor that is an actual candidate in that exact run.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProposalDecisionRequest' } } } }
      responses: { '201': { description: Immutable decision }, '403': { $ref: '#/components/responses/Problem' }, '422': { $ref: '#/components/responses/Problem' } }
  /proposals/{id}/decision-context/{discoveryRunId}:
    get:
      summary: Read one explicitly selected proposal and its exact frozen discovery run
      description: Returns no fallback proposal, run, candidate, or decision. A mismatched proposal/run pair is rejected.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { in: path, name: discoveryRunId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Exact decision context, content: { application/json: { schema: { $ref: '#/components/schemas/DecisionContext' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /proposals/{id}/continuation-evidence:
    post:
      summary: Append a revision of objective-to-open-item mappings and predecessor access for a CONTINUE route
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Append-only continuation evidence revision }, '422': { $ref: '#/components/responses/Problem' } }
  /proposals/{id}/route-evidence/{predecessorId}:
    get:
      summary: Read assessed continuation and improvement prerequisites for an exact predecessor
      description: Missing evidence is UNASSESSED and nullable numeric or boolean values are omitted rather than being represented as zero or false.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { in: path, name: predecessorId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Assessed route prerequisites, content: { application/json: { schema: { $ref: '#/components/schemas/RouteAssessment' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /proposals/{id}/improvement-claims:
    post:
      summary: Record a predecessor limitation, baseline, target, and evaluation method
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Persisted improvement claim }, '422': { $ref: '#/components/responses/Problem' } }
  /proposals/{id}/adviser-recommendations:
    get:
      summary: Read immutable adviser recommendations for a proposal
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Adviser recommendations } }
    post:
      summary: Record an immutable adviser recommendation against a frozen discovery run
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Immutable adviser recommendation }, '403': { $ref: '#/components/responses/Problem' } }
  /projects:
    get:
      summary: List research projects accessible to the current account
      parameters: [ { in: query, name: mine, schema: { type: boolean, default: true } } ]
      responses: { '200': { description: Accessible projects } }
  /projects/{id}:
    get:
      summary: Read a project with an ETag
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Project, headers: { ETag: { schema: { type: string } } } } }
  /projects/{id}/traceability:
    get:
      summary: Read the current trace graph, findings, executions, and coverage
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Traceability assessment } }
  /projects/{id}/trace-graph:
    get:
      summary: Read a bounded page of graph nodes and in-page relationships
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, default: 50 } }
      responses:
        '200':
          description: Bounded graph page with explicit totals and truncated state
          content: { application/json: { schema: { $ref: '#/components/schemas/TraceGraphPage' } } }
  /projects/{id}/findings:
    get:
      summary: Read current findings with stable fingerprints and effective dispositions
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Current findings and recurrence-aware states } }
  /projects/{id}/findings/{findingId}/{action}:
    post:
      summary: Resolve, accept with expiry, or reopen a finding
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { in: path, name: findingId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: action, required: true, schema: { enum: [resolve, accept, reopen] } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: Durable disposition and new project ETag }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/memberships:
    get:
      summary: List explicit project memberships
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Project memberships } }
    post:
      summary: Curator grant of a role-scoped project membership
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Membership grant }, '403': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/health:
    get:
      summary: Read independent project-health dimensions
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Health snapshot } }
  /projects/{id}/scope-risk:
    get:
      summary: Read the explained scope-risk calculation
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Scope risk or UNASSESSED } }
  /projects/{id}/lineage:
    get:
      summary: Read predecessor and successor lineage
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Lineage graph } }
  /projects/{id}/completion-package:
    get:
      summary: Read the server-derived continuity package and readiness evidence
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Completion package with nullable assessed values
          content: { application/json: { schema: { $ref: '#/components/schemas/CompletionPackage' } } }
  /projects/{id}/completion-package/evidence-references:
    get:
      summary: List append-only evidence references for the selected completion package
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Project-scoped completion evidence references
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvidenceReference' } } } }
  /projects/{id}/analysis-runs:
    post:
      summary: Recalculate deterministic alignment analysis
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      responses: { '201': { description: Current analysis }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/trace-items:
    post:
      summary: Create a draft trace item in the project's mutable working evidence chain
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: "Created item, recalculated analysis, and new project ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/trace-items/{itemId}/revisions:
    post:
      summary: Create a new trace-item revision and stale dependent test evidence
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: "Immutable new revision, stale-evidence findings, and new ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/trace-links:
    post:
      summary: Create a validated same-project typed trace relationship
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: "Created relationship, recalculated analysis, and new ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/test-executions:
    post:
      summary: Record current baseline-bound execution evidence for an approved test case
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: "Recorded execution, superseded prior current evidence, analysis, and new ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/baselines/approve:
    post:
      summary: Coordinator approval of a new immutable baseline after hard readiness and trace checks
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Approved baseline snapshot and new project ETag }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/completion-package/evidence:
    post:
      summary: Append references and recalculate continuity readiness on the server
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompletionEvidenceInput' } } } }
      responses: { '200': { description: "Server-computed readiness/status, recalculated health, and new ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/completion-package/evidence-references/{referenceId}/verification:
    post:
      summary: Append an independent adviser, coordinator, or reviewer verification
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: referenceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceVerificationInput' } } } }
      responses: { '200': { description: "Appended verification, recalculated readiness, and new project ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/complete:
    post:
      summary: Evaluate gates and, when eligible, atomically complete the project and publish its one linked catalogue study
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      responses: { '200': { description: "Completion eligibility, blockers, completed project/catalogue study when successful, and the resulting current project ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /change-requests:
    get: { summary: List change requests, responses: { '200': { description: Change requests } } }
    post:
      summary: Create a baseline-bound change request
      parameters: [ { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeInput' } } } }
      responses: { '201': { description: Change request }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /change-requests/{id}/preview-impact:
    post:
      summary: Recalculate the cycle-safe blast radius
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      responses: { '200': { description: Exact impact paths and stale evidence }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /change-requests/{id}/impact:
    get:
      summary: Read the latest persisted cycle-safe impact preview
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: "Impact paths, stale evidence, and scope risk" } }
  /change-requests/{id}/operations:
    get:
      summary: Read ordered typed change operations
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: "ADD, REVISE, RETIRE, and RELINK operations" } }
    post:
      summary: Add one typed baseline-bound change operation
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Persisted ordered operation }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /change-requests/{id}/{decision}:
    post:
      summary: Coordinator approval, rejection, or return of a controlled change
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { in: path, name: decision, required: true, schema: { enum: [approve, reject, return-for-revision] } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: Immutable decision; approval creates exactly one baseline N+1 }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /continuation-items:
    get: { summary: "Search open predecessor limitations, recommendations, and unfinished work", responses: { '200': { description: Visible continuation opportunities } } }
  /projects/{id}/continuation-claims:
    post:
      summary: Claim an open predecessor item for a successor objective
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Successor claim preserving predecessor history }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /continuation-claims/{id}/outcomes:
    post:
      summary: Append a COMPLETED, PARTIAL, DEFERRED, or INVALIDATED claim outcome
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Append-only claim outcome }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /review-queue:
    get:
      deprecated: true
      summary: Redirect a scoped legacy review URL to the canonical project inbox
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string, format: uuid } }
      responses: { '308': { description: Canonical project review route } }
  /projects/{id}/reviews:
    get:
      summary: Read the persisted project review inbox and append-only history
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Project-scoped research reviews
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ResearchReview' } } } }
  /projects/{id}/reviews/{reviewId}/revision-requests:
    post:
      summary: Append an actor-attributed revision request
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewMessageInput' } } } }
      responses: { '200': { description: "Appended request, current review history, and new project ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /projects/{id}/reviews/{reviewId}/revision-responses:
    post:
      summary: Append an actor-attributed response to the current revision request
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewMessageInput' } } } }
      responses: { '200': { description: "Appended response, current review history, and new project ETag" }, '412': { $ref: '#/components/responses/Problem' }, '428': { $ref: '#/components/responses/Problem' } }
  /algorithm-disclosure:
    get: { summary: "Read formula, model status, fallback, and decision boundary", responses: { '200': { description: Algorithm disclosure } } }
  /users:
    get:
      summary: List persistent platform accounts
      description: Identity-governance read intended for curators.
      responses:
        '200': { description: Accounts and assigned roles, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/User' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /invitations:
    get:
      summary: List invitations without raw tokens
      description: Identity-governance read intended for curators. Previously returned one-time tokens are never listed again.
      responses:
        '200': { description: Invitation history, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Invitation' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a 72-hour single-use invitation
      description: Requires CURATOR. The raw token appears only in this response and must be delivered out of band.
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { enum: [STUDENT, ADVISER, COORDINATOR, CURATOR] }
      responses:
        '201': { description: Invitation including its one-time raw token, content: { application/json: { schema: { $ref: '#/components/schemas/Invitation' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /evaluation/datasets:
    get:
      summary: List retrieval-evaluation dataset versions
      description: Requires ADVISER, COORDINATOR, or CURATOR.
      responses:
        '200': { description: Dataset versions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvaluationDatasetVersion' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create a draft immutable-corpus evaluation version
      description: Requires CURATOR. Omitted or empty studyIds snapshots all current catalogue studies; the resolved corpus must contain 1 through 10,000 studies.
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationDatasetRequest' } } } }
      responses:
        '201': { description: Draft dataset version, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationDatasetVersion' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluation/datasets/{versionId}:
    get:
      summary: Read one evaluation dataset version and manifest status
      description: Requires ADVISER, COORDINATOR, or CURATOR.
      parameters: [ { in: path, name: versionId, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Dataset version, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationDatasetVersion' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /evaluation/datasets/{versionId}/queries:
    get:
      summary: List structured queries and review completeness
      description: Requires ADVISER, COORDINATOR, or CURATOR.
      parameters: [ { in: path, name: versionId, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Structured evaluation queries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvaluationQuery' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      summary: Add one structured query to a draft dataset
      description: Requires CURATOR. Frozen versions reject authoring.
      parameters:
        - { in: path, name: versionId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationQueryRequest' } } } }
      responses:
        '201': { description: Created structured query, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationQuery' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluation/datasets/{versionId}/queries/import:
    post:
      summary: Import 1 through 500 structured queries into a draft dataset
      description: Requires CURATOR. Requests are added sequentially; a later invalid item can fail after earlier items have persisted, so callers should reconcile with the query-list endpoint.
      parameters:
        - { in: path, name: versionId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, minItems: 1, maxItems: 500, items: { $ref: '#/components/schemas/EvaluationQueryRequest' } }
      responses:
        '201': { description: Queries created before successful completion, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EvaluationQuery' } } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluation/queries/{queryId}/judgments:
    post:
      summary: Append an independent relevance-judgment revision
      description: Requires ADVISER or COORDINATOR. A judgment grades one study in the query's frozen corpus from 0 through 3; it does not change an academic route.
      parameters:
        - { in: path, name: queryId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationGradeRequest' } } } }
      responses:
        '201': { description: Append-only judgment revision, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationJudgment' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluation/queries/{queryId}/qrels:
    post:
      summary: Append a coordinator-adjudicated graded qrel
      description: Requires COORDINATOR and two distinct current reviewer judgments for the same query-study pair.
      parameters:
        - { in: path, name: queryId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationGradeRequest' } } } }
      responses:
        '201': { description: Append-only adjudicated qrel, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationQrel' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluation/datasets/{versionId}/freeze:
    post:
      summary: Freeze the corpus, queries, and independently adjudicated qrels
      description: Requires COORDINATOR. Every query needs at least one relevant adjudicated qrel; every adjudicated pair needs two distinct current reviewers and re-adjudication after a reviewer revision.
      parameters:
        - { in: path, name: versionId, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/CsrfHeader' }
      responses:
        '200': { description: Frozen hashed dataset version, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationDatasetVersion' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluation/runs:
    post:
      summary: Queue a durable four-arm retrieval comparison
      description: Requires ADVISER, COORDINATOR, or CURATOR. Only a frozen hashed dataset can run. Poll the returned Location; evaluation never mutates a proposal decision.
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRunRequest' } } } }
      responses:
        '202': { description: Durable queued run, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRun' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /evaluation/runs/{runId}:
    get:
      summary: Poll durable evaluation-run state
      description: Requires ADVISER, COORDINATOR, or CURATOR.
      parameters: [ { in: path, name: runId, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Current run state, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationRun' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /evaluation/runs/{runId}/report:
    get:
      summary: Read the dataset manifest, environment, algorithms, metrics, and resource report
      description: Requires ADVISER, COORDINATOR, or CURATOR. Curators receive ranked hits; adviser/coordinator responses retain an empty rankedHits array. A queued/running report may have no algorithm rows yet.
      parameters: [ { in: path, name: runId, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Reproducible evaluation report, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationReport' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /evaluation/runs/{runId}/report.csv:
    get:
      summary: Export aggregate evaluation metrics as CSV
      description: Requires ADVISER, COORDINATOR, or CURATOR. Ranked hits are never exported; null metric values are emitted as UNAVAILABLE.
      parameters: [ { in: path, name: runId, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Aggregate metric CSV, headers: { Content-Disposition: { schema: { type: string } } }, content: { text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /warehouse/refresh:
    post:
      summary: Run the six-stage warehouse pipeline and publish only a complete snapshot
      description: Requires CURATOR. The same source hash returns UNCHANGED. A caught pipeline failure returns HTTP 500 with the durable FAILED LoadView and does not replace the latest published snapshot.
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '200': { description: Source unchanged, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseLoad' } } } }
        '201': { description: New immutable snapshot published, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseLoad' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '500': { description: Failed durable load; prior published snapshot retained, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseLoad' } } } }
  /warehouse/loads/latest:
    get:
      summary: Read the latest warehouse load and stage/quality state
      description: Requires CURATOR. If no load exists, returns an honest UNASSESSED object rather than 404.
      responses:
        '200': { description: Latest load or UNASSESSED state, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseLoad' } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /warehouse/loads/{loadId}:
    get:
      summary: Read one durable warehouse load
      description: Requires CURATOR.
      parameters: [ { in: path, name: loadId, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Load state, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseLoad' } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /warehouse/loads/{loadId}/quality:
    get:
      summary: Read field-level quality issues for one warehouse load
      description: Requires CURATOR.
      parameters: [ { in: path, name: loadId, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '200': { description: Quality issues, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WarehouseQualityIssue' } } } } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /warehouse/analytics:
    get:
      summary: Read authorized historical research aggregates from the latest published snapshot
      description: Requires any authenticated role. Non-curators receive globally visible plus same-department non-restricted rows. No snapshot returns UNASSESSED with empty arrays.
      parameters:
        - { in: query, name: department, schema: { type: string, maxLength: 160 }, description: Case-insensitive exact department code or name }
        - { in: query, name: fromYear, schema: { type: integer, minimum: 1900, maximum: 2200 } }
        - { in: query, name: toYear, schema: { type: integer, minimum: 1900, maximum: 2200 } }
      responses:
        '200': { description: "Snapshot/as-of, quality, actual counts, topics, research areas, and trends", content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseAnalytics' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /warehouse/analytics.csv:
    get:
      summary: Export the same authorized warehouse analytics as CSV
      description: Requires any authenticated role. Filters and row scope match the JSON endpoint; cells are protected against spreadsheet-formula injection.
      parameters:
        - { in: query, name: department, schema: { type: string, maxLength: 160 } }
        - { in: query, name: fromYear, schema: { type: integer, minimum: 1900, maximum: 2200 } }
        - { in: query, name: toYear, schema: { type: integer, minimum: 1900, maximum: 2200 } }
      responses:
        '200': { description: Authorized analytics CSV, headers: { Content-Disposition: { schema: { type: string } } }, content: { text/csv: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /warehouse/continuation-history:
    get:
      summary: Read authorized predecessor/successor/claim history
      description: Requires any authenticated role. Source/target visibility applies and non-curators need explicit membership for successor-project facts.
      parameters: [ { in: query, name: limit, schema: { type: integer, default: 100, minimum: 1, maximum: 500 }, description: Values are clamped to 1 through 500 } ]
      responses:
        '200': { description: Authorized continuation history or UNASSESSED state, content: { application/json: { schema: { $ref: '#/components/schemas/WarehouseContinuationHistory' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /warehouse/continuation-history.csv:
    get:
      summary: Export authorized continuation history as CSV
      description: Requires any authenticated role. Scope matches JSON and cells are protected against spreadsheet-formula injection.
      parameters: [ { in: query, name: limit, schema: { type: integer, default: 500, minimum: 1, maximum: 500 }, description: Values are clamped to 1 through 500 } ]
      responses:
        '200': { description: Authorized continuation CSV, headers: { Content-Disposition: { schema: { type: string } } }, content: { text/csv: { schema: { type: string, format: binary } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: SESSION
  parameters:
    Id: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    IfMatch: { in: header, name: If-Match, required: true, schema: { type: string }, description: Exact ETag returned by the project resource; wildcard values are rejected }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 1, maxLength: 128 }, description: Stable per-account key reused only when retrying the same normalized intake }
    CsrfHeader: { in: header, name: X-XSRF-TOKEN, required: true, schema: { type: string }, description: Token returned by GET /auth/csrf and paired with its session cookie }
  responses:
    Problem:
      description: RFC 9457 problem detail
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    RouteAssessment:
      type: object
      required: [continuationState, improvementState]
      properties:
        continuationState: { enum: [ASSESSED, PARTIAL, UNASSESSED, UNAVAILABLE] }
        continuationCoverage: { type: [number, 'null'], format: double, minimum: 0, maximum: 100 }
        codeAccess: { type: [boolean, 'null'] }
        dataAccess: { type: [boolean, 'null'] }
        improvementState: { enum: [ASSESSED, PARTIAL, UNASSESSED, UNAVAILABLE] }
        improvementClaimCount: { type: [integer, 'null'], minimum: 1 }
    AuthView:
      type: object
      required: [authenticated, roles]
      properties:
        authenticated: { type: boolean }
        email: { type: [string, 'null'] }
        roles: { type: array, items: { type: string } }
    User:
      type: object
      required: [id, email, displayName, status, roles]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        department: { type: [string, 'null'] }
        status: { type: string }
        roles: { type: array, items: { enum: [STUDENT, ADVISER, COORDINATOR, CURATOR] } }
    Invitation:
      type: object
      required: [id, email, intendedRole, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        intendedRole: { enum: [STUDENT, ADVISER, COORDINATOR, CURATOR] }
        expiresAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        oneTimeToken: { type: [string, 'null'], description: Present only in the invitation-creation response }
    CatalogueSearchPage:
      type: object
      required: [items, totalItems, page, pageSize, generatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/CatalogueStudySummary' } }
        totalItems: { type: integer, format: int64 }
        page: { type: integer }
        pageSize: { type: integer }
        generatedAt: { type: string, format: date-time }
    CatalogueStudySummary:
      type: object
      required: [id, title, keywords, objectiveCount]
      properties:
        id: { type: string, format: uuid }
        institutionalCode: { type: [string, 'null'] }
        title: { type: string }
        academicYear: { type: [string, 'null'] }
        completionYear: { type: [integer, 'null'] }
        departmentCode: { type: [string, 'null'] }
        departmentName: { type: [string, 'null'] }
        program: { type: [string, 'null'] }
        lifecycleStatus: { type: [string, 'null'] }
        visibility: { type: [string, 'null'] }
        abstractText: { type: [string, 'null'] }
        problemStatement: { type: [string, 'null'] }
        methodology: { type: [string, 'null'] }
        keywords: { type: array, items: { type: string } }
        resultsText: { type: [string, 'null'] }
        objectiveCount: { type: integer }
    ResearchQueryGrammar:
      type: object
      required: [version, ebnf, fields, comparators, algorithms, examples, limits, safety]
      properties:
        version: { type: string, example: ugnay-rql-1.0.0 }
        ebnf: { type: string }
        fields: { type: array, items: { type: string } }
        comparators: { type: array, items: { type: string } }
        algorithms: { type: array, items: { enum: [LEXICAL, TFIDF, SEMANTIC, HYBRID] } }
        examples: { type: array, items: { type: string } }
        limits: { type: object, additionalProperties: { type: integer } }
        safety: { type: string }
