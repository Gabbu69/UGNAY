      required: [verificationState, notes]
      properties:
        verificationState: { enum: [VERIFIED, REJECTED, UNAVAILABLE] }
        notes: { type: string, minLength: 20, maxLength: 1000 }
    ReviewMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 20, maxLength: 2000 }
        evidenceLocation: { type: [string, 'null'], maxLength: 1000 }
    ResearchReviewEvent:
      type: object
      required: [id, eventType, message, actorEmail, createdAt]
      properties:
        id: { type: string, format: uuid }
        eventType: { enum: [REVISION_REQUESTED, REVISION_RESPONDED] }
        message: { type: string }
        evidenceLocation: { type: [string, 'null'] }
        actorEmail: { type: string, format: email }
        createdAt: { type: string, format: date-time }
    ResearchReview:
      type: object
      required: [id, projectId, type, title, projectCode, severity, requiredRole, reason, dueAt, status, history]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        projectCode: { type: string }
        severity: { enum: [INFO, LOW, MODERATE, HIGH, CRITICAL] }
        requiredRole: { type: string }
        reason: { type: string }
        dueAt: { type: string, format: date-time }
        status: { enum: [OPEN, REVISION_REQUESTED, REVISION_RESPONDED] }
        history: { type: array, items: { $ref: '#/components/schemas/ResearchReviewEvent' } }
    TraceGraphPage:
      type: object
      required: [nodes, edges, page, size, totalNodes, totalEdges, truncated]
      properties:
        nodes: { type: array, maxItems: 500, items: { type: object } }
        edges: { type: array, maxItems: 1000, items: { type: object } }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        totalNodes: { type: integer, minimum: 0 }
        totalEdges: { type: integer, minimum: 0 }
        truncated: { type: boolean }
    IntakeResponse:
      type: object
      required: [idempotencyKey, replayed, problem, proposal, discovery, evidenceReferences]
      properties:
        idempotencyKey: { type: string }
        replayed: { type: boolean }
        problem: { type: object }
        proposal: { type: object }
        discovery: { $ref: '#/components/schemas/DiscoveryRun' }
        evidenceReferences: { type: array, items: { $ref: '#/components/schemas/EvidenceReference' } }
    DiscoveryInput:
      type: object
      required: [proposalId]
      properties:
        proposalId: { type: string, format: uuid }
    ChangeInput:
      type: object
      required: [projectId, basedOnBaselineId, title, rationale, changedItemIds]
      properties:
        projectId: { type: string, format: uuid }
        basedOnBaselineId: { type: string, format: uuid, description: Exact current baseline; omission or mismatch is rejected }
        title: { type: string, minLength: 1 }
        rationale: { type: string, minLength: 20 }
        changedItemIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        boundaryFlags: { type: array, items: { type: string } }
    DiscoveryRun:
      type: object
      required: [id, status, recommendation, confidenceState, candidates, algorithmVersion]
      properties:
        id: { type: string, format: uuid }
        status: { enum: [ASSESSED, UNASSESSED, STALE, PARTIAL] }
        recommendation: { enum: [NEW, IMPROVE, CONTINUE, POSSIBLE_DUPLICATE, REVIEW_REQUIRED] }
        confidenceState: { enum: [ASSESSED, PARTIAL, UNASSESSED, UNAVAILABLE] }
        confidence: { type: [number, 'null'], minimum: 0, maximum: 100 }
        candidates: { type: array, items: { $ref: '#/components/schemas/Study' } }
        algorithmVersion: { type: string }
    ProposalDecisionRequest:
      type: object
      required: [proposalId, discoveryRunId, disposition, rationale]
      properties:
        proposalId: { type: string, format: uuid }
        discoveryRunId: { type: string, format: uuid }
        disposition: { enum: [APPROVE_NEW, APPROVE_IMPROVE, APPROVE_CONTINUE, RETURN_FOR_REVISION, CLOSE_AS_DUPLICATE] }
        rationale: { type: string, minLength: 20 }
        primaryPredecessorId: { type: [string, 'null'], format: uuid }
    DecisionContext:
      type: object
      required: [proposal, discovery, adviserRecommendations]
      properties:
        proposal: { type: object }
        discovery: { type: object, description: Exact persisted DiscoveryRun with only authorized candidates }
        decision: { type: [object, 'null'] }
        adviserRecommendations: { type: array, items: { type: object } }
    Study:
      type: object
      required: [id, code, title, year, program, status, abstract, authors, keywords, problemSimilarity, solutionSimilarity, objectiveOverlap, confidence, relationship, matchReason, excerpt]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        title: { type: string }
        year: { type: integer }
        program: { type: string }
        status: { enum: [COMPLETED, INCOMPLETE, SUSPENDED] }
        abstract: { type: string }
        authors: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string } }
        problemSimilarity: { type: number }
        solutionSimilarity: { type: number }
        objectiveOverlap: { type: number }
        confidence: { type: number }
        relationship: { type: string }
        matchReason: { type: string }
        excerpt: { type: string }
        restricted: { type: boolean }
    Workspace:
      type: object
      required: [currentUser, project, projects, studies, traceNodes, traceEdges, findings, health, reviewQueue, lineage, generatedAt]
      additionalProperties: true
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri }
