name: Publish tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build the bundled application
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test -- --run
          npm run build
          cd ..
          mkdir -p backend/target/generated-static
          cp -R frontend/dist/. backend/target/generated-static/
          chmod +x backend/mvnw
          backend/mvnw -q package
          sha256sum backend/target/ugnay-backend-0.2.0.jar > SHA256SUMS-app.txt
          expected="$(jq -r '.assets.app.sha256' infra/windows-lite/runtime-manifest.json)"
          actual="$(sha256sum backend/target/ugnay-backend-0.2.0.jar | cut -d ' ' -f 1)"
          test "$actual" = "$expected"
      - name: Publish application asset
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            backend/target/ugnay-backend-0.2.0.jar
            SHA256SUMS-app.txt
